version: '3'

dotenv: ['.env']

vars:
  BUF_VERSION: "1.73.0"
  # Keep in sync with google.golang.org/protobuf in go.mod
  PROTOC_GEN_GO_VERSION: "1.36.12"
  PROTOC_GEN_GO_GRPC_VERSION: "1.6.2"
  GOVULNCHECK_VERSION: "1.8.0"
  GOLANGCI_LINT_VERSION: "2.14.0"
  # Git information during the build process
  CB_GIT_SHA:
    sh: git rev-parse HEAD
  CB_GIT_TAG:
    sh: git tag --sort=-creatordate | head -n 1

env:
  GOFIPS140: '{{ if eq .FIPS_MODE_ENABLED "true" }}{{ .FIPS_MODE_MODULE_VERSION }}{{ end }}'
  GODEBUG: '{{ if eq .FIPS_MODE_ENABLED "true" }}{{ .FIPS_GODEBUG_VALUE }}{{ end }}'
  CRYPTO_BROKER_PROFILES_DIR: '{{.PWD}}/example-profiles'
  CRYPTO_BROKER_BENCHMARKING_SIGNCERTIFICATE_CA_CERT: '{{.PWD}}/../crypto-broker-deployment/testing/certificates/test-ca/cert-test-CA-nist-secp256r1.pem'
  CRYPTO_BROKER_BENCHMARKING_SIGNCERTIFICATE_PRIVATE_KEY: '{{.PWD}}/../crypto-broker-deployment/testing/certificates/test-ca/test-CA-nist-secp256r1.pem'
  CRYPTO_BROKER_BENCHMARKING_SIGNCERTIFICATE_CSR: '{{.PWD}}/../crypto-broker-deployment/testing/certificates/test-csr/csr-rsa-2048.csr'
  CRYPTO_BROKER_PPROF_ADDR: '{{.PPROF_ADDR}}'
  CRYPTO_BROKER_LOG_LEVEL: '{{.OTEL_LOGS_LEVEL}}'
  CRYPTO_BROKER_LOG_FORMAT: '{{.OTEL_LOGS_FORMAT}}'
  CRYPTO_BROKER_LOG_OUTPUT: '{{.OTEL_LOGS_OUTPUT}}'

tasks:
  ################# Development Tools ####################
  # Additional resources:
  # - https://go.dev/doc/install
  # - https://buf.build/docs/installation
  # - https://buf.build/docs/lint/rules
  # - https://go.dev/doc/tutorial/govulncheck
  tools:
    desc: "Download tools required for development"
    deps: [install-buf, install-go-protoc-modules, install-go-vulnerability-check, install-golangci-lint]
    cmds:
      - buf --version && protoc-gen-go --version && govulncheck --version && golangci-lint --version

  # More about benchmarks:
  # - https://pkg.go.dev/testing@go1.25.3#hdr-Benchmarks
  # - https://go.googlesource.com/proposal/+/master/design/14313-benchmark-format.md
  # - go help testflag
  run-benchmarks:
    desc: "Command runs benchmarks. For this to work, you need to have the deployment repository in the same parent directory as this repository."
    deps: [build]
    vars:
      APP_NAME: '{{.APP_NAME | default "crypto-broker-server"}}'
    cmds:
      - go version -m bin/{{.APP_NAME}}
      - go test ./... -run=^$ -bench=. -count=1

  assert-benchmarks:
    desc: "Run benchmarks with performance assertions"
    deps:  [build]
    cmds:
      - echo "Running benchmarks with JSON output..."
      - go test ./... -run=^$ -bench=. -benchmem -count=1 -json 2>&1 | tee benchmark-results.json || echo "Benchmarks completed with failures, proceeding with assertions..."
      - echo "Running benchmark performance assertions..."
      - chmod +x benchmark-assert.sh
      - ./benchmark-assert.sh benchmark-results.json

  # Installed via go install rather than brew so that every platform gets the
  # pinned version.
  install-buf:
    desc: "Download and install the buf CLI"
    cmds:
      - go install github.com/bufbuild/buf/cmd/buf@v{{.BUF_VERSION}}

  # Installed via go install rather than brew so that generated stubs are
  # reproducible across macOS, Linux and CI.
  install-go-protoc-modules:
    desc: "Install Go modules for protobuf and gRPC support"
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v{{.PROTOC_GEN_GO_VERSION}}
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v{{.PROTOC_GEN_GO_GRPC_VERSION}}

  install-go-vulnerability-check:
    desc: "Install Go vulnerability checking tool"
    cmds:
      - go install golang.org/x/vuln/cmd/govulncheck@v{{.GOVULNCHECK_VERSION}}

  install-golangci-lint:
    desc: "Install golangci-lint"
    cmds:
      - curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v{{.GOLANGCI_LINT_VERSION}}

  ################# Crypto Broker Server Execution ####################
  cleanup-socket:
    desc: "Cleans up the Crypto Broker server socket"
    cmds:
      - rm -rf /tmp/open-crypto-broker/crypto-broker-server.sock

  run:
    desc: "Runs Crypto Broker server locally"
    deps: [build]
    vars:
      APP_NAME: '{{.APP_NAME | default "crypto-broker-server"}}'
    env:
      CRYPTO_BROKER_APP_ENV: '{{.APP_ENV}}'
    cmds:
      - defer: {task: cleanup-socket}
      - ./bin/{{.APP_NAME}}

  copy-env:
    desc: "Copies example environment variables to .env file"
    cmds:
      - cp .env.example .env

  ################# Build Crypto Broker Server ####################
  build:
    desc: "Builds Crypto Broker server binary"
    vars:
      APP_NAME: '{{.APP_NAME | default "crypto-broker-server"}}'
    cmds:
      - 'echo "Building {{.APP_NAME}} with Git SHA: {{.CB_GIT_SHA}} and Git Tag: {{.CB_GIT_TAG}}"'
      - go build -o bin/{{.APP_NAME}} -ldflags="-X main.gitSHA={{.CB_GIT_SHA}} -X main.gitTag={{.CB_GIT_TAG}}" ./cmd/server
      - go version -m bin/{{.APP_NAME}}
    sources:
      - cmd/server/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
      - .env
    generates:
      - bin/{{.APP_NAME}}

  build-docker:
    desc: "Builds Crypto Broker server in a Docker image"
    vars:
      TAG: '{{.TAG | default "dev"}}'
    cmds:
      - git submodule update --init --recursive
      - |
        docker buildx build \
          --build-arg="CRYPTO_BROKER_PROFILES_DIR=example-profiles" \
          --build-arg="GOFIPS140=${GOFIPS140:-off}" \
          -f docker/Dockerfile \
          -t ghcr.io/open-crypto-broker/server:{{.TAG}} .

  proto-update:
    desc: "Updates the protobuf submodule to the latest upstream schema and regenerates"
    cmds:
      - git submodule update --remote protobuf/
      - task: proto

  proto:
    desc: "Generates Go stubs from the pinned proto submodule"
    cmds:
      - buf generate

  ################# Continuous Improvement Tasks ####################
  check-dependencies:
    desc: "Set the dependencies"
    cmds:
      - go mod tidy && go mod verify

  format:
    desc: "Apply formatting rules to Go code"
    cmds:
      - go fmt ./...

  lint:
    desc: "Apply linting to Go code"
    cmds:
      - go vet ./...

  unit-test:
    desc: "Run unit-tests"
    cmds:
      - go test ./... -skip E2E -cover
      - go test ./... -run E2E -cover

  vulnerability-check:
    desc: "Run vulnerability check"
    deps: [install-go-vulnerability-check]
    cmds:
      - govulncheck ./...

  golangci-lint:
    desc: "Run golangci-lint"
    deps: [install-golangci-lint]
    cmds:
      - golangci-lint run ./...

  ci:
    desc: "Runs continuous integration checks on source code"
    cmds:
      - task: check-dependencies
      - task: format
      - task: lint
      - task: golangci-lint
      - task: unit-test
      - task: vulnerability-check

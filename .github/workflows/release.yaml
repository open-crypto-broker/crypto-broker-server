name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ORG: open-crypto-broker
  IMAGE_NAME: server
  APP_NAME: crypto-broker-server
  COMPONENT_NAME: github.com/open-crypto-broker/crypto-broker-server

jobs:

################################################
# Metadata
################################################
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      is_rc: ${{ steps.meta.outputs.is_rc }}
      image_repo: ${{ steps.meta.outputs.image_repo }}
      component_repo: ${{ steps.meta.outputs.component_repo }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: meta
        run: |
          TAG="${{ github.ref_name }}"
          COMMIT=$(git rev-parse HEAD)

          if [[ "$TAG" == *"-rc"* ]]; then
            IS_RC=true
            IMAGE_REPO="ghcr.io/open-crypto-broker/server-rc"
            COMPONENT_REPO="ghcr.io/open-crypto-broker/ocm-components-rc"
          else
            IS_RC=false
            IMAGE_REPO="ghcr.io/open-crypto-broker/server"
            COMPONENT_REPO="ghcr.io/open-crypto-broker/ocm-components"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "is_rc=$IS_RC" >> $GITHUB_OUTPUT
          echo "image_repo=$IMAGE_REPO" >> $GITHUB_OUTPUT
          echo "component_repo=$COMPONENT_REPO" >> $GITHUB_OUTPUT

      - name: Print release summary
        run: |
          echo "Release tag: ${{ steps.meta.outputs.tag }}"
          echo "RC mode: ${{ steps.meta.outputs.is_rc }}"
          echo "Docker repo: ${{ steps.meta.outputs.image_repo }}"
          echo "OCM repo: ${{ steps.meta.outputs.component_repo }}"

################################################
# Build binaries (reusable workflow)
################################################
  build-binaries:
    needs: metadata

    uses: open-crypto-broker/.github/.github/workflows/build-release.yaml@main
    with:
      is_rc: ${{ needs.metadata.outputs.is_rc }}
      language: go
      app-name: crypto-broker-server
      tag: ${{ needs.metadata.outputs.tag }}

################################################
# Build Docker image (reusable workflow)
################################################
  docker:
    needs: metadata
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/open-crypto-broker
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docker image and push
        id: build
        uses: open-crypto-broker/.github/actions/publish-ghcr@main
        with:
          is_rc: ${{ needs.metadata.outputs.is_rc }}
          registry: ghcr.io/open-crypto-broker
          image_name: server
          image_tag: ${{ needs.metadata.outputs.tag }}
          image_sha: ${{ needs.metadata.outputs.commit }}

      - name: Print digest
        run: echo "Digest=${{ steps.build.outputs.digest }}"

################################################
# SBOM + Security Scan
################################################
  security:
    needs:
      - metadata
      - docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build image reference
        id: image
        run: |
          echo "ref=${{ needs.metadata.outputs.image_repo }}@${{ needs.docker.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output-file: server-${{ needs.metadata.outputs.tag }}-sbom.spdx.json

      - name: Scan image
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.image.outputs.ref }}
          fail-build: true
          severity-cutoff: high

      - name: Upload SBOM to GitHub Release
        uses: softprops/action-gh-release@v2
        if: needs.metadata.outputs.is_rc != 'true'
        with:
          files: server-${{ needs.metadata.outputs.tag }}-sbom.spdx.json

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
          | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Attach SBOM to image (OCI referrer)
        run: |
          SBOM=${IMAGE_NAME}-${{ needs.metadata.outputs.tag }}-sbom.spdx.json
          oras attach "${{ steps.image.outputs.ref }}" "$SBOM" \
            --artifact-type application/spdx+json

################################################
# OCM Component
################################################
  ocm:
    needs:
      - metadata
      - docker

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup OCM
        uses: open-component-model/ocm-setup-action@main

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
          | ocm login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Create component version
        run: |
          TAG=${{ needs.metadata.outputs.tag }}
          ocm create componentversion \
            --provider github.com/${ORG} \
            ${COMPONENT_NAME}:$TAG

      - name: Add git commit label
        run: |
          TAG=${{ needs.metadata.outputs.tag }}
          COMMIT=${{ needs.metadata.outputs.commit }}
          ocm add label \
            --name git.commit \
            --value $COMMIT \
            ${COMPONENT_NAME}:$TAG

      - name: Add git repository label
        run: |
          TAG=${{ needs.metadata.outputs.tag }}
          ocm add label \
            --name git.repository \
            --value https://${COMPONENT_NAME} \
            ${COMPONENT_NAME}:$TAG

      - name: Add docker image digest
        run: |
          TAG=${{ needs.metadata.outputs.tag }}
          ocm add label \
            --name image.digest \
            --value ${{ needs.docker.outputs.digest }} \
            ${COMPONENT_NAME}:$TAG

      - name: Add container image
        run: |
          TAG=${{ needs.metadata.outputs.tag }}
          ocm add resource \
            --type ociImage \
            --access-type ociArtifact \
            --image-reference ${{ needs.metadata.outputs.image_repo }}@${{ needs.docker.outputs.digest }} \
            ${COMPONENT_NAME}:$TAG \
            ${IMAGE_NAME}

      - name: Add binaries
        run: |
          TAG=${{ needs.metadata.outputs.tag }}
          PLATFORMS=(
            linux-x86_64
            macos-arm64
          )

          for platform in "${PLATFORMS[@]}"; do
            ocm add resource \
              --type application/zip \
              --access-type ociArtifact \
              --image-reference ghcr.io/${ORG}/${APP_NAME}-binary-${platform}:$TAG \
              ${COMPONENT_NAME}:$TAG \
              binary-${platform}
          done

      - name: Publish component
        run: |
          TAG=${{ needs.metadata.outputs.tag }}
          ocm transfer componentversion \
            ${COMPONENT_NAME}:$TAG \
            ${{ needs.metadata.outputs.component_repo }}

      - name: Sign component (Sigstore)
        run: |
          TAG=${{ needs.metadata.outputs.tag }}
          ocm sign componentversion \
            ${{ needs.metadata.outputs.component_repo }}//${COMPONENT_NAME}:$TAG \
            --signature sigstore

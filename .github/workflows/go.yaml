name: Go Continuous Improvement
on:
  push:
    branches: [ main ]
    paths:
      - 'cmd/**.go'
      - 'internal/**.go'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  license-check:
    name: License Compliance
    permissions:
      contents: read # for checking out code
    uses: open-crypto-broker/.github/.github/workflows/license-compliance.yaml@main # nolint # zizmor: ignore[unpinned-uses]
    with:
      directory_to_scan: '.'

  go-pipeline:
    name: Go CI Pipeline
    permissions:
      contents: read # for checking out code and submodules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI task from Taskfile
        run: task ci

      - name: Run end-2-end tests
        run: CRYPTO_BROKER_PROFILES_DIR=${GITHUB_WORKSPACE}/example-profiles go test -run E2E -race ./...

      - name: Run unit tests
        run: |
          CRYPTO_BROKER_PROFILES_DIR=${GITHUB_WORKSPACE}/example-profiles go test -skip E2E -covermode=count -coverpkg=./... -coverprofile cover.out -v ./...
          go tool cover -html cover.out -o cover.html

      - name: Archive code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-coverage-report
          path: cover.html

      - name: Run benchmarks with JSON output (non-FIPS mode)
        continue-on-error: true
        run: |
          CRYPTO_BROKER_PROFILES_DIR=${GITHUB_WORKSPACE}/example-profiles go test -run=^$ -bench='BenchmarkLibraryNative_(Hash|SignCertificate_CSR_SECP256R1_CA_RSA4096|SignCertificate_CSR_SECP521R1_CA_SECP521R1|SignCertificate_CSR_SECP256R1_CA_SECP384R1)' -benchmem -json ./... > benchmark-results.json

      - name: Assert benchmark performance
        continue-on-error: false
        run: |
          chmod +x benchmark-assert.sh
          ./benchmark-assert.sh benchmark-results.json

      - name: Run benchmarks with FIPS mode
        continue-on-error: true
        run: |
          GOFIPS140=v1.0.0 CRYPTO_BROKER_PROFILES_DIR=${GITHUB_WORKSPACE}/example-profiles go test -run=^$ -bench='BenchmarkLibraryNative_(HashData|SignCertificate_CSR_SECP256R1_CA_RSA4096|SignCertificate_CSR_SECP521R1_CA_SECP521R1|SignCertificate_CSR_SECP256R1_CA_SECP384R1)' -benchmem ./...

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-json-${{ github.sha }}
          path: benchmark-results.json
          retention-days: 14

name: Go Continuous Improvement
on:
  push:
    branches: [ main ]
    paths:
      - 'cmd/**.go'
      - 'internal/**.go'
  pull_request:

permissions: {}

jobs:
  go-pipeline:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Install Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI task from Taskfile
        run: task ci

      - name: Run end-2-end tests
        run: CRYPTO_BROKER_PROFILES_DIR=${GITHUB_WORKSPACE}/example-profiles go test -run E2E -race ./...

      - name: Run unit tests
        run: |
          CRYPTO_BROKER_PROFILES_DIR=${GITHUB_WORKSPACE}/example-profiles go test -skip E2E -covermode=count -coverpkg=./... -coverprofile cover.out -v ./...
          go tool cover -html cover.out -o cover.html

      - name: Archive code coverage results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: code-coverage-report
          path: cover.html

      - name: Run benchmarks with JSON output (non-FIPS mode)
        continue-on-error: true
        run: |
          CRYPTO_BROKER_PROFILES_DIR=${GITHUB_WORKSPACE}/example-profiles go test -run=^$ -bench='BenchmarkLibraryNative_(Hash|SignCertificate_CSR_SECP256R1_CA_RSA4096|SignCertificate_CSR_SECP521R1_CA_SECP521R1|SignCertificate_CSR_SECP256R1_CA_SECP384R1)' -benchmem -json ./... > benchmark-results.json

      - name: Assert benchmark performance
        continue-on-error: false
        run: |
          chmod +x benchmark-assert.sh
          ./benchmark-assert.sh benchmark-results.json

      - name: Run benchmarks with FIPS mode
        continue-on-error: true
        run: |
          GOFIPS140=v1.0.0 CRYPTO_BROKER_PROFILES_DIR=${GITHUB_WORKSPACE}/example-profiles go test -run=^$ -bench='BenchmarkLibraryNative_(Hash|SignCertificate_CSR_SECP256R1_CA_RSA4096|SignCertificate_CSR_SECP521R1_CA_SECP521R1|SignCertificate_CSR_SECP256R1_CA_SECP384R1)' -benchmem ./...

      - name: Upload benchmark results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: benchmark-results-json-${{ github.sha }}
          path: benchmark-results.json
          retention-days: 14

version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/open-crypto-broker/crypto-broker-server/internal/gen

plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/gen
    opt: paths=source_relative

inputs:
  # third_party/ is intentionally skipped: the gRPC health stubs come from
  # google.golang.org/grpc/health/grpc_health_v1.
  - directory: protobuf
    paths:
      - protobuf/cryptobroker
